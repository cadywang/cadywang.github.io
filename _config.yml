# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: cadywang 的博客
subtitle: '记录与思考'
description: '个人技术笔记与生活记录'
keywords: 博客,技术,笔记,生活
author: cadywang
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 站点地址：项目名为 <用户名>.github.io 时，root 保持 /
url: https://cadywang.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 未分类
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option: 'mtime'(文件修改时间) | 'date'(用 front-matter，推荐) | 'empty'
## 用 mtime 会导致 CI 每次构建都把全部文章标成"已更新"，故用 date
updated_option: 'date'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude (仅对 source/ 生效)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# RSS / Sitemap / 本地搜索
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: false
sitemap:
  path: sitemap.xml
search:
  path: search.xml
  field: post
  content: true
  format: html

# Deployment (本项目由 GitHub Actions 发布，无需 hexo deploy)
deploy:
  type: ''
